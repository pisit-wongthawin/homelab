global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'home-server'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'nut-ups'
    metrics_path: /ups_metrics
    static_configs:
      - targets: ['nut_exporter:9199']

  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']
